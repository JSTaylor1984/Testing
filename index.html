        text-align: center;

    input:focus {

    }

    #result {

        font-size: 15px;
        text-align: left;

    .label {

function lookupState() {
    const input = document.getElementById("stateInput").value.toLowerCase();
    const resultDiv = document.getElementById("result");

    let match = states.find(s =>
        s.abbr.toLowerCase().startsWith(input) ||
        s.name.toLowerCase().startsWith(input)
    );

    if (match) {
        resultDiv.innerHTML = `
            <div class="state-title">${match.name} (${match.abbr})</div>

            <div><span class="label">Actions Permitted:</span> ${match.action}</div>

            <div><span class="label tooltip"
                title="Cancellation Requests, Forms, Proof, Documents Requested by Underwriting">
                Underwriting:
            </span> ${match.underwriting}</div>

            <div><span class="label">DP1 Reprints:</span> ${match.dp1_reprints}</div>
            <div><span class="label">Cancellation:</span> ${match.cancellation}</div>
            <div><span class="label">Moves:</span> ${match.move}</div>
        `;

        // Background color logic
        switch (match.action) {
            case "All":
                document.body.style.backgroundColor = "#2ecc71";
                break;
            case "Billing, Paments, POC, Lienholder":
                document.body.style.backgroundColor = "#f1c40f";
                break;
            case "Payments & Billing ONLY":
                document.body.style.backgroundColor = "#e74c3c";
                break;
            case "No Move Ins or Copy Policy":
                document.body.style.backgroundColor = "#e67e22";
                break;
            default:
                document.body.style.backgroundColor = "#0018F9";
        }
    } else {
        resultDiv.innerHTML = "<div style='text-align:center;'>No match found</div>";
        document.body.style.backgroundColor = "#0018F9";
    }
}
