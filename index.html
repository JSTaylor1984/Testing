<title>State Action Lookup</title>

        font-size: 18px;

    }

    }
</style>

    {abbr:"MN", name:"Minnesota", action:"All", dp1_reprints:"R2ConfirmProc@geico.com", underwriting:"UW9@GEICO.COM"},
    {abbr:"MS", name:"Mississippi", action:"Billing, Paments, POC, Lienholder",dp1_reprints:"R3ConfirmProc@geico.com", underwriting:""},

    {abbr:"WI", name:"Wisconsin", action:"Billing, Paments, POC, Lienholder", dp1_reprints:"R2ConfirmProc@geico.com", underwriting:"UW9@GEICO.COM"},
    {abbr:"WV", name:"West Virginia", action:"Billing, Paments, POC, Lienholder",dp1_reprints:"", underwriting:""},
    {abbr:"WY", name:"Wyoming", action:"All",dp1_reprints:"", underwriting:""}
];

function lookupState() {
    const input = document.getElementById("stateInput").value.toLowerCase();
    const resultDiv = document.getElementById("result");

    let match = states.find(s =>
        s.abbr.toLowerCase().startsWith(input) ||
        s.name.toLowerCase().startsWith(input)
    );

    if (match) {
        resultDiv.innerHTML = `${match.name} (${match.abbr})<br>Action: ${match.action}<br><br><br><br>Underwriting(Cancellation requests, Forms, Proof): ${match.underwriting}<br>DP1 Reprints: ${match.dp1_reprints}`;

        // Change background color
        switch (match.action) {
            case "All":
                document.body.style.backgroundColor = "lightgreen";
                break;
            case "Billing, Paments, POC, Lienholder":
                document.body.style.backgroundColor = "yellow";
                break;
            case "Payments & Billing ONLY":
                document.body.style.backgroundColor = "red";
                break;
            case "No Move Ins or Copy Policy":
                document.body.style.backgroundColor = "orange";
                break;
            default:
                document.body.style.backgroundColor = "white";
        }
    } else {
        resultDiv.innerHTML = "No match found";
        document.body.style.backgroundColor = "white";
    }
}
</script>

</body>
</html>
