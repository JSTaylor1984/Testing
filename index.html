function lookupState() {
    const input = document.getElementById("stateInput").value.toLowerCase();
    const resultDiv = document.getElementById("result");

    let match = states.find(s =>
        s.abbr.toLowerCase().startsWith(input) ||
        s.name.toLowerCase().startsWith(input)
    );



if (match) {
    resultDiv.innerHTML = `${match.name} (${match.abbr})<br>
    Action: ${match.action}<br><br>
    <span class="tooltip" title="Cancellation Requests, Forms, Proof, Documents Requested by Underwriting">
        Underwriting
    </span>: ${match.underwriting}<br>
    DP1 Reprints: ${match.dp1_reprints}<br>
    Cancellation Requests: ${match.cancellation}
    For Moves to this state: ${match.move}`;




        // Change background color
        switch (match.action) {
            case "All":
                document.body.style.backgroundColor = "lightgreen";
                break;
            case "Billing, Paments, POC, Lienholder":
                document.body.style.backgroundColor = "yellow";
                break;
            case "Payments & Billing ONLY":
                document.body.style.backgroundColor = "red";
                break;
            case "No Move Ins or Copy Policy":
                document.body.style.backgroundColor = "orange";
                break;
            default:
                document.body.style.backgroundColor = "blue";
        }
    } else {
        resultDiv.innerHTML = "No match found";
        document.body.style.backgroundColor = "white";
    }
}
