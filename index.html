<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>State Action Lookup</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #0018F9;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        transition: background-color 0.3s ease;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #azClock {
        color: white;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 20px;
        letter-spacing: 1px;
        text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .card {
        background-color: white;
        padding: 30px 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        width: 450px;
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
    }

    input {
        padding: 12px;
        font-size: 16px;
        width: 100%;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-bottom: 20px;
        outline: none;
        transition: border 0.2s ease;
        box-sizing: border-box;
    }

    input:focus {
        border-color: #0018F9;
    }

    #result {
        margin-top: 10px;
        font-size: 15px;
        text-align: left;
        line-height: 1.6;
    }

    .label {
        font-weight: bold;
    }

    .tooltip {
        text-decoration: underline dotted;
        cursor: help;
    }

    .state-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: center;
    }
</style>

</head>

<body>

<div class="container">

    <div id="azClock">Loading Arizona Time...</div>

    <div class="card">
        <h2>State Action Lookup!</h2>

        <input type="text" id="stateInput"
            placeholder="Type state name or abbreviation..."
            oninput="lookupState()" />

        <div id="result"></div>
    </div>

</div>

<script>

function updateArizonaClock() {
    const now = new Date();

    const azTime = now.toLocaleTimeString("en-US", {
        timeZone: "America/Phoenix",
        hour12: true,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    document.getElementById("azClock").innerText =
        `Arizona Time: ${azTime}`;
}

updateArizonaClock();
setInterval(updateArizonaClock, 1000);

const states = [
    {
        abbr:"AZ",
        name:"Arizona",
        action:"All",
        dp1_reprints:"R10ConfirmProc@geico.com",
        underwriting:"uw10@geico.com",
        move:"Please transfer to Sales",
        cancellation:"No special handling required",
        reissue:"You can reissue/restart for this state-- QC024"
    },
    {
        abbr:"CA",
        name:"California",
        action:"Billing, Payments, POC, Lienholder",
        dp1_reprints:"R4ConfirmProc@geico.com",
        underwriting:"uw4@geico.com",
        move:"Please transfer to Service",
        cancellation:"No special handling required",
        reissue:"Transfer to Reissue department-- QC024"
    },
    {
        abbr:"NV",
        name:"Nevada",
        action:"All",
        dp1_reprints:"R10ConfirmProc@geico.com",
        underwriting:"uw10@geico.com",
        move:"You can process moves to this state",
        cancellation:"No special handling required",
        reissue:"Transfer to Reissue department-- QC114"
    }
];

function lookupState() {

    const input = document.getElementById("stateInput")
        .value
        .toLowerCase()
        .trim();

    const resultDiv = document.getElementById("result");

    let match;

    if (input.length === 2) {

        match = states.find(
            s => s.abbr.toLowerCase() === input
        );

    } else if (input.length > 2) {

        match = states.find(
            s => s.name.toLowerCase().startsWith(input)
        );

    } else {

        match = null;
    }

    if (match) {

        resultDiv.innerHTML = `
            <div class="state-title">
                ${match.name} (${match.abbr})
            </div>

            <div>
                <span class="label">Actions Permitted:</span>
                ${match.action}
            </div>

            <div>
                <span class="label tooltip"
                    title="Cancellation Requests, Forms, Proof, Documents Requested by Underwriting">
                    Underwriting:
                </span>
                ${match.underwriting}
            </div>

            <div>
                <span class="label">DP1 Reprints:</span>
                ${match.dp1_reprints}
            </div>

            <div>
                <span class="label">Cancellation:</span>
                ${match.cancellation}
            </div>

            <div>
                <span class="label">Moves to this state:</span>
                ${match.move}
            </div>

            <div>
                <span class="label">Reissues or Restarts:</span>
                ${match.reissue}
            </div>
        `;

        switch (match.action) {

            case "All":
                document.body.style.backgroundColor = "#2ecc71";
                break;

            case "Billing, Payments, POC, Lienholder":
                document.body.style.backgroundColor = "#f1c40f";
                break;

            case "Payments & Billing ONLY":
                document.body.style.backgroundColor = "#e74c3c";
                break;

            case "No Move Ins or Copy Policy":
                document.body.style.backgroundColor = "#e67e22";
                break;

            case "Elizabeth":
                document.body.style.backgroundColor = "#ff66cc";
                break;

            default:
                document.body.style.backgroundColor = "#0018F9";
        }

    } else {

        resultDiv.innerHTML =
            "<div style='text-align:center;'>No match found</div>";

        document.body.style.backgroundColor = "#0018F9";
    }
}

</script>

</body>
</html>
